# Publish to npm on `v*` tags via trusted publishing (OIDC); no npm token is stored anywhere.
# One-time setup on npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions,
# user `onenora`, repository `pi-tui-footer`, workflow `publish.yml`.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Verify tag matches package.json version
        run: |
          version=$(bun -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }

      - run: bun install
      - run: bun run check
      - run: bun test

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm publish
